<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Chart</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #0e1117; color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif; height: 100%; overflow: hidden; }
  #wrap { display: flex; flex-direction: column; height: 100vh; }
  #topbar { display:flex; align-items:center; justify-content:space-between; padding:10px 14px;
    background:#131722; border-bottom:1px solid #232733; }
  #topbar .sym { font-weight:700; font-size:16px; }
  #topbar .price { font-weight:700; font-size:16px; }
  #topbar .price.up { color:#26a69a; } #topbar .price.down { color:#ef5350; }
  #chg { font-size:12px; margin-inline-start:6px; }
  #chg.up { color:#26a69a; } #chg.down { color:#ef5350; }
  #tf-row { display:flex; gap:6px; padding:6px 10px; background:#131722; overflow-x:auto; }
  #tf-row button { background:#1c2030; color:#9aa2b1; border:none; border-radius:6px; padding:6px 12px;
    font-size:12px; white-space:nowrap; }
  #tf-row button.active { background:#2962ff; color:#fff; }
  #chart { flex: 1 1 auto; min-height: 0; }
  #panel { background:#131722; border-top:1px solid #232733; padding:10px 14px 14px; }
  .row { display:flex; gap:8px; margin-bottom:8px; }
  .side-btn { flex:1; padding:10px; border-radius:8px; border:1px solid #2a2f3d; background:#1c2030;
    color:#9aa2b1; font-weight:700; font-size:14px; }
  .side-btn.long.active { background:#0f3d34; border-color:#26a69a; color:#26a69a; }
  .side-btn.short.active { background:#3d1414; border-color:#ef5350; color:#ef5350; }
  select, input { flex:1; background:#1c2030; border:1px solid #2a2f3d; color:#e8e8e8; border-radius:8px;
    padding:9px; font-size:13px; text-align:center; }
  label.mini { font-size:11px; color:#7a8194; display:block; margin-bottom:3px; }
  .field { flex:1; }
  #submitBtn { width:100%; padding:13px; border-radius:10px; border:none; font-weight:700; font-size:15px;
    background:#2962ff; color:#fff; margin-top:4px; }
  #submitBtn:disabled { opacity:.5; }
  #msg { font-size:12px; color:#7a8194; text-align:center; margin-top:6px; min-height:14px; }
  #posBox { display:none; background:#161a26; border:1px solid #232733; border-radius:10px; padding:10px;
    margin-bottom:10px; font-size:13px; }
  #posBox .pnl.up { color:#26a69a; } #posBox .pnl.down { color:#ef5350; }
  #closeBtn { width:100%; padding:10px; border-radius:8px; border:1px solid #ef5350; background:transparent;
    color:#ef5350; font-weight:700; margin-top:8px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <div class="sym" id="symLabel">—</div>
    <div><span class="price" id="priceLabel">…</span><span id="chg"></span></div>
  </div>
  <div id="tf-row">
    <button data-tf="1m">1m</button>
    <button data-tf="5m">5m</button>
    <button data-tf="15m" class="active">15m</button>
    <button data-tf="1h">1h</button>
    <button data-tf="4h">4h</button>
    <button data-tf="1d">1d</button>
  </div>
  <div id="chart"></div>
  <div id="panel">
    <div id="posBox">
      <div id="posText"></div>
      <button id="closeBtn">❌ بستن معامله</button>
    </div>
    <div id="openBox">
      <div class="row">
        <button class="side-btn long active" id="btnLong">🟢 LONG</button>
        <button class="side-btn short" id="btnShort">🔴 SHORT</button>
      </div>
      <div class="row">
        <div class="field"><label class="mini">اهرم</label>
          <select id="lev"><option>1</option><option>2</option><option selected>5</option><option>10</option><option>20</option><option>50</option></select>
        </div>
        <div class="field"><label class="mini">مارجین ($)</label>
          <input id="margin" type="number" inputmode="decimal" value="100" min="1">
        </div>
      </div>
      <div class="row">
        <div class="field"><label class="mini">حد سود (TP)</label>
          <input id="tp" type="number" inputmode="decimal" placeholder="اختیاری">
        </div>
        <div class="field"><label class="mini">حد ضرر (SL)</label>
          <input id="sl" type="number" inputmode="decimal" placeholder="اختیاری">
        </div>
      </div>
      <button id="submitBtn">📊 باز کردن معامله دمو</button>
      <div id="msg"></div>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const qs = new URLSearchParams(location.search);
const SYMBOL = (qs.get('symbol') || 'BTCUSDT').toUpperCase();
const COIN_ID = qs.get('coin_id') || '';
const COIN_LABEL = qs.get('label') || SYMBOL.replace('USDT','');
const LANG = qs.get('lang') || 'fa';
const ENTRY = parseFloat(qs.get('entry') || '');
const TP_Q = parseFloat(qs.get('tp') || '');
const SL_Q = parseFloat(qs.get('sl') || '');
const POS_ID = qs.get('pos_id') || '';
const POS_SIDE = qs.get('pos_side') || '';
const POS_ENTRY = parseFloat(qs.get('pos_entry') || '');
const POS_MARGIN = parseFloat(qs.get('pos_margin') || '');
const POS_LEV = parseFloat(qs.get('pos_lev') || '');

document.getElementById('symLabel').textContent = COIN_LABEL + '/USDT';
if (!isNaN(TP_Q)) document.getElementById('tp').value = TP_Q;
if (!isNaN(SL_Q)) document.getElementById('sl').value = SL_Q;

const chartEl = document.getElementById('chart');
const chart = LightweightCharts.createChart(chartEl, {
  layout: { background: { color: '#0e1117' }, textColor: '#9aa2b1' },
  grid: { vertLines: { color: '#181c26' }, horzLines: { color: '#181c26' } },
  rightPriceScale: { borderColor: '#232733' },
  timeScale: { borderColor: '#232733', timeVisible: true, secondsVisible: false },
  crosshair: { mode: 0 },
});
const series = chart.addCandlestickSeries({
  upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
  wickUpColor: '#26a69a', wickDownColor: '#ef5350',
});
new ResizeObserver(entries => {
  const { width, height } = entries[0].contentRect;
  chart.resize(width, height);
}).observe(chartEl);

let priceLines = [];
function clearLines() { priceLines.forEach(l => series.removePriceLine(l)); priceLines = []; }
function drawLine(price, color, title) {
  if (isNaN(price) || !price) return;
  priceLines.push(series.createPriceLine({ price, color, lineWidth: 2, lineStyle: 2, axisLabelVisible: true, title }));
}
function redrawTradeLines() {
  clearLines();
  if (POS_ID) {
    drawLine(POS_ENTRY, '#787b86', LANG === 'fa' ? 'ورود' : 'Entry');
    const tp = parseFloat(document.getElementById('tp').value);
    const sl = parseFloat(document.getElementById('sl').value);
    drawLine(tp, '#26a69a', 'TP');
    drawLine(sl, '#ef5350', 'SL');
  } else {
    if (!isNaN(ENTRY)) drawLine(ENTRY, '#787b86', LANG === 'fa' ? 'ورود پیشنهادی' : 'Suggested Entry');
    const tp = parseFloat(document.getElementById('tp').value);
    const sl = parseFloat(document.getElementById('sl').value);
    drawLine(tp, '#26a69a', 'TP');
    drawLine(sl, '#ef5350', 'SL');
  }
}
document.getElementById('tp').addEventListener('input', redrawTradeLines);
document.getElementById('sl').addEventListener('input', redrawTradeLines);

const TF_MAP = { '1m':60, '5m':300, '15m':900, '1h':3600, '4h':14400, '1d':86400 };
let currentTf = '15m';
let ws = null;
let lastPrice = null;

async function loadKlines(tf) {
  const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${SYMBOL}&interval=${tf}&limit=300`);
  const raw = await res.json();
  const data = raw.map(k => ({ time: Math.floor(k[0]/1000), open: +k[1], high: +k[2], low: +k[3], close: +k[4] }));
  series.setData(data);
  chart.timeScale().fitContent();
  redrawTradeLines();
  return data.length ? data[data.length-1] : null;
}

function connectWs(tf) {
  if (ws) { try { ws.close(); } catch(e){} }
  ws = new WebSocket(`wss://stream.binance.com:9443/ws/${SYMBOL.toLowerCase()}@kline_${tf}`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    const k = msg.k;
    const bar = { time: Math.floor(k.t/1000), open: +k.o, high: +k.h, low: +k.l, close: +k.c };
    series.update(bar);
    updatePriceLabel(bar.close);
  };
}

let last24hChange = null;
async function loadTicker() {
  try {
    const res = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${SYMBOL}`);
    const d = await res.json();
    last24hChange = parseFloat(d.priceChangePercent);
    const chgEl = document.getElementById('chg');
    chgEl.textContent = (last24hChange >= 0 ? '▲ +' : '▼ ') + last24hChange.toFixed(2) + '%';
    chgEl.className = last24hChange >= 0 ? 'up' : 'down';
  } catch (e) {}
}

function updatePriceLabel(price) {
  const el = document.getElementById('priceLabel');
  const prev = lastPrice;
  lastPrice = price;
  el.textContent = '$' + price.toLocaleString(undefined, { maximumFractionDigits: price < 1 ? 6 : 2 });
  el.className = 'price ' + (prev !== null && price >= prev ? 'up' : 'down');
}

async function switchTf(tf) {
  currentTf = tf;
  document.querySelectorAll('#tf-row button').forEach(b => b.classList.toggle('active', b.dataset.tf === tf));
  const last = await loadKlines(tf);
  if (last) updatePriceLabel(last.close);
  connectWs(TF_MAP[tf] ? tf : '15m');
}
document.querySelectorAll('#tf-row button').forEach(b => b.addEventListener('click', () => switchTf(b.dataset.tf)));

switchTf('15m');
loadTicker();
setInterval(loadTicker, 30000);

// ---- trade panel ----
let side = 'long';
document.getElementById('btnLong').addEventListener('click', () => {
  side = 'long';
  document.getElementById('btnLong').classList.add('active');
  document.getElementById('btnShort').classList.remove('active');
});
document.getElementById('btnShort').addEventListener('click', () => {
  side = 'short';
  document.getElementById('btnShort').classList.add('active');
  document.getElementById('btnLong').classList.remove('active');
});

if (POS_ID) {
  document.getElementById('openBox').style.display = 'none';
  document.getElementById('posBox').style.display = 'block';
  document.getElementById('posText').textContent =
    (LANG === 'fa' ? 'پوزیشن باز: ' : 'Open position: ') + POS_SIDE.toUpperCase() + ' ×' + POS_LEV +
    ' | ' + (LANG === 'fa' ? 'ورود' : 'Entry') + ': $' + POS_ENTRY;
  document.getElementById('closeBtn').addEventListener('click', () => {
    const payload = { action: 'close_demo_trade', pos_id: POS_ID };
    if (tg) tg.sendData(JSON.stringify(payload)); 
  });
}

document.getElementById('submitBtn').addEventListener('click', () => {
  const margin = parseFloat(document.getElementById('margin').value);
  const lev = parseInt(document.getElementById('lev').value, 10);
  const tp = parseFloat(document.getElementById('tp').value) || null;
  const sl = parseFloat(document.getElementById('sl').value) || null;
  const msgEl = document.getElementById('msg');
  if (!margin || margin <= 0) { msgEl.textContent = LANG === 'fa' ? 'مارجین معتبر وارد کن' : 'Enter a valid margin'; return; }
  const payload = { action: 'open_demo_trade', coin_id: COIN_ID, coin_label: COIN_LABEL, side, leverage: lev, margin, tp, sl };
  if (tg) {
    tg.sendData(JSON.stringify(payload));
  } else {
    msgEl.textContent = 'این صفحه باید داخل تلگرام باز بشه.';
  }
});
</script>
</body>
</html>
